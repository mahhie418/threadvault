[project]
name = "threadvault"
version = "0.1.0"
description = "Back up a Slack workspace to a GitHub repository as an AI-readable vault."
readme = "README.md"
authors = [
    { name = "Mahiro Sakaue", email = "mahhie418@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "platformdirs>=4.12.2",
    "python-dotenv>=1.2.4",
    "slack-sdk>=3.45.0",
    "tzdata>=2026.4 ; sys_platform == 'win32'",
]

[project.scripts]
threadvault = "threadvault.terminal:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C90", "CPY", "EM", "INP", "TC", "TRY", "PLR09",
    "COM812", "D201", "D202", "D211", "E501", "E701", "E702", "PTH118"
]

[tool.ruff.lint.per-file-ignores]
"src/threadvault/terminal.py" = [
    "T201"
]
"src/threadvault/vault/repository.py" = [
    "S603"
]
"tests/**" = [
    "D",
    "PLR2004", "S101", "S105", "S106", "S603"
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
lines-after-imports = 1

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ty.environment]
extra-paths = ["scripts"]

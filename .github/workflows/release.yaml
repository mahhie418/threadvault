name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - name: uv (build)
        run: uv build
      - name: threadvault (manifest; wheel)
        run: uv run --isolated --no-project --python 3.14 --with dist/*.whl threadvault manifest
      - name: threadvault (manifest; sdist)
        run: uv run --isolated --no-project --python 3.14 --with dist/*.tar.gz threadvault manifest
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/attest-action@v0.0.6
      - name: uv (publish)
        run: uv publish
